<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/scopyx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">scopyx</text>
<text x="172" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- the order is the argument</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">Five gates, in one fixed order. Where a request stops is the whole answer.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#9aa7b8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; SCHEME</text><rect x="40" y="150" width="224" height="380" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="58" y="196" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">http and https only</text><text x="58" y="222" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">nothing else opens a socket</text><rect x="64.0" y="303.0" width="176" height="54" rx="27.0" fill="none" stroke="#3fb950" stroke-width="1.1" opacity="0.3"/><rect x="68.0" y="307.0" width="168" height="46" rx="23.0" fill="#1a212c" stroke="#3fb950" stroke-width="2"/><text x="152" y="329" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">cleared</text><text x="152" y="345" font-size="9.5" fill="#3fb950" font-weight="700" text-anchor="middle" letter-spacing="0.5"></text><path d="M 272 321 L 281 330 L 272 339" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; HOST</text><rect x="288" y="150" width="224" height="380" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="306" y="196" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">the name, before it resolves</text><text x="306" y="222" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">no wildcard eats a sibling</text><rect x="312.0" y="303.0" width="176" height="54" rx="27.0" fill="none" stroke="#3fb950" stroke-width="1.1" opacity="0.3"/><rect x="316.0" y="307.0" width="168" height="46" rx="23.0" fill="#1a212c" stroke="#3fb950" stroke-width="2"/><text x="400" y="329" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">cleared</text><text x="400" y="345" font-size="9.5" fill="#3fb950" font-weight="700" text-anchor="middle" letter-spacing="0.5"></text><path d="M 520 321 L 529 330 L 520 339" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="538" y="138" font-size="12" fill="#ff6b63" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; ADDRESS</text><rect x="536" y="150" width="224" height="380" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="554" y="196" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">where it resolves to</text><text x="554" y="222" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">loopback, link-local, private</text><rect x="560.0" y="303.0" width="176" height="54" rx="27.0" fill="none" stroke="#ff6b63" stroke-width="1.1" opacity="0.3"/><rect x="564.0" y="307.0" width="168" height="46" rx="23.0" fill="#1a212c" stroke="#ff6b63" stroke-width="2"/><text x="648" y="329" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">refused here</text><text x="648" y="345" font-size="9.5" fill="#ff6b63" font-weight="700" text-anchor="middle" letter-spacing="0.5"></text><text x="648" y="400" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">the answer names</text><text x="648" y="416" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">this gate</text><path d="M 768 321 L 777 330 L 768 339" fill="none" stroke="#283341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="786" y="138" font-size="12" fill="#2dd4bf" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; POLICY</text><rect x="784" y="150" width="224" height="380" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="802" y="196" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">what wardryx would say</text><text x="802" y="222" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">allow, deny or hold</text><rect x="808.0" y="303.0" width="176" height="54" rx="27.0" fill="none" stroke="#69788b" stroke-width="1.1" opacity="0.3"/><rect x="812.0" y="307.0" width="168" height="46" rx="23.0" fill="#1a212c" stroke="#69788b" stroke-width="2"/><text x="896" y="329" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">never reached</text><text x="896" y="345" font-size="9.5" fill="#69788b" font-weight="700" text-anchor="middle" letter-spacing="0.5"></text><text x="896" y="400" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">the request never</text><text x="896" y="416" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">got this far</text><path d="M 1016 321 L 1025 330 L 1016 339" fill="none" stroke="#283341" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="1034" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">05 &#183; ROBOTS</text><rect x="1032" y="150" width="224" height="380" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="1050" y="196" font-size="13.5" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">what the site asked for</text><text x="1050" y="222" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">the site&#x27;s rule, not yours</text><rect x="1056.0" y="303.0" width="176" height="54" rx="27.0" fill="none" stroke="#69788b" stroke-width="1.1" opacity="0.3"/><rect x="1060.0" y="307.0" width="168" height="46" rx="23.0" fill="#1a212c" stroke="#69788b" stroke-width="2"/><text x="1144" y="329" font-size="13" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">never reached</text><text x="1144" y="345" font-size="9.5" fill="#69788b" font-weight="700" text-anchor="middle" letter-spacing="0.5"></text><text x="1144" y="400" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">the request never</text><text x="1144" y="416" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="middle">got this far</text><line x1="40" y1="566" x2="1240" y2="566" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="40" y="598" font-size="15" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">The address gate sits before the policy gate on purpose.</text><text x="40" y="622" font-size="13" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A policy that would have allowed the request never gets to, because a name that resolves inward is refused first.</text><text x="40" y="648" font-size="13" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Every answer records the origin only. The path and the query string of a fetched URL are never written down: that is where an identifier or a session token lives.</text></svg>