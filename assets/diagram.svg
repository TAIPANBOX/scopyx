<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 996 402" width="996" height="402" role="img" aria-label="scopyx: a fetch passes five gates in order, the scheme, the host, every address the name resolves to, the operator's policy plane and last the site's own robots.txt. The animation follows one request to the cloud metadata address: it clears the scheme and the host and is refused at the address gate, while the policy gate and the robots gate are never reached, because the address rules sit before the policy that would have allowed it.">
  <title>Five gates, in this order, and the order is the claim</title>

  <style>
    /* One request, followed to where it stops.
       CSS rather than SMIL because GitHub renders a README's SVG as an image:
       scripts are stripped and clicks never arrive, but a stylesheet inside the
       document still runs. The interactive version of this argument, where a
       reader picks which request to send, lives on it-rat.com. */
    @keyframes sxRun {
      0%,4%    { transform: translate(136px,160px); opacity: 0; }
      6%       { transform: translate(136px,160px); opacity: 1; }
      16%      { transform: translate(210px,160px); }
      28%      { transform: translate(322px,160px); }
      40%,86%  { transform: translate(434px,160px); opacity: 1; }
      94%,100% { transform: translate(434px,160px); opacity: 0; }
    }
    @keyframes sxLit  { 0%,15% { stroke:#2a3547; fill:#141C27; } 18%,100% { stroke:#F0ABFC; fill:#1B1522; } }
    @keyframes sxLit2 { 0%,27% { stroke:#2a3547; fill:#141C27; } 30%,100% { stroke:#F0ABFC; fill:#1B1522; } }
    @keyframes sxStop { 0%,39% { stroke:#2a3547; fill:#141C27; } 42%,100% { stroke:#FF8A8A; fill:#1F1418; } }
    @keyframes sxBar   { 0%,39% { opacity:0; } 44%,90% { opacity:1; } 100% { opacity:0; } }
    @keyframes sxNever { 0%,42% { opacity:1; } 52%,90% { opacity:.22; } 100% { opacity:1; } }
    @keyframes sxSay   { 0%,44% { opacity:0; } 50%,90% { opacity:1; } 100% { opacity:0; } }
    @keyframes sxFlow  { to { stroke-dashoffset:-28; } }

    .pkt   { animation: sxRun 11s cubic-bezier(.4,.05,.3,1) infinite; }
    .g1    { animation: sxLit 11s linear infinite; }
    .g2    { animation: sxLit2 11s linear infinite; }
    .g3    { animation: sxStop 11s linear infinite; }
    .bar   { animation: sxBar 11s linear infinite; }
    .never { animation: sxNever 11s linear infinite; }
    .say   { animation: sxSay 11s linear infinite; }
    .lane  { stroke-dasharray: 6 8; animation: sxFlow 1.6s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      /* The end state, which is what carries the point. */
      .pkt    { animation: none; transform: translate(434px,160px); }
      .g1,.g2 { animation: none; stroke:#F0ABFC; fill:#1B1522; }
      .g3     { animation: none; stroke:#FF8A8A; fill:#1F1418; }
      .bar,.say { animation: none; opacity: 1; }
      .never  { animation: none; opacity: .22; }
      .lane   { animation: none; }
    }
  </style>

  <rect x="-18" y="-18" width="996" height="402" rx="16" fill="#0A0E13"/>
  <rect x="-17.5" y="-17.5" width="995" height="401" rx="15.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <defs>
    <marker id="sxr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#FF8A8A"/>
    </marker>
  </defs>

  <g font-family="ui-monospace,Menlo,monospace" text-anchor="middle">

    <path d="M836 128 C836 48 800 30 700 30 L300 30 C220 30 136 46 136 130"
          fill="none" stroke="#FF8A8A" stroke-width="1.6" stroke-dasharray="6 6"
          marker-end="url(#sxr)" opacity=".55"/>
    <text x="486" y="22" fill="#FF8A8A" font-size="10.5" opacity=".75">302: a destination the caller never named, so all five run again</text>

    <line class="lane" x1="138" y1="160" x2="812" y2="160" stroke="#2a3547" stroke-width="1.6"/>

    <rect x="8" y="134" width="130" height="52" rx="12" fill="#141C27" stroke="#2a3547"/>
    <text x="73" y="157" fill="#E9EFF6" font-size="11.5" font-weight="700">your agent</text>
    <text x="73" y="172" fill="#5A6675" font-size="9.5">a URL, and no headers</text>

    <rect x="146" y="68" width="596" height="192" rx="14" fill="#0C1118" stroke="rgba(255,255,255,.10)"/>
    <circle cx="166" cy="87" r="3.5" fill="#F0ABFC"/>
    <text x="178" y="91" fill="#5A6675" font-size="10" letter-spacing="1.4" text-anchor="start">SCOPYX, THE PLANE YOU RUN</text>

    <text x="210" y="110" fill="#E9EFF6" font-size="11" font-weight="700">scheme</text>
    <rect class="g1" x="162" y="118" width="96" height="26" rx="7" fill="#1B1522" stroke="#F0ABFC"/>
    <rect class="g1" x="162" y="176" width="96" height="26" rx="7" fill="#1B1522" stroke="#F0ABFC"/>
    <text x="210" y="217" fill="#5A6675" font-size="9">http or https,</text>
    <text x="210" y="229" fill="#5A6675" font-size="9">nothing else</text>

    <text x="322" y="110" fill="#E9EFF6" font-size="11" font-weight="700">host</text>
    <rect class="g2" x="274" y="118" width="96" height="26" rx="7" fill="#1B1522" stroke="#F0ABFC"/>
    <rect class="g2" x="274" y="176" width="96" height="26" rx="7" fill="#1B1522" stroke="#F0ABFC"/>
    <text x="322" y="217" fill="#5A6675" font-size="9">not localhost,</text>
    <text x="322" y="229" fill="#5A6675" font-size="9">not .internal</text>

    <text x="434" y="110" fill="#E9EFF6" font-size="11" font-weight="700">address</text>
    <rect class="g3" x="386" y="118" width="96" height="26" rx="7" fill="#1F1418" stroke="#FF8A8A"/>
    <rect class="bar" x="392" y="146" width="84" height="28" rx="5" fill="#FF8A8A"/>
    <rect class="g3" x="386" y="176" width="96" height="26" rx="7" fill="#1F1418" stroke="#FF8A8A"/>
    <text x="434" y="217" fill="#5A6675" font-size="9">every one it</text>
    <text x="434" y="229" fill="#5A6675" font-size="9">resolves to, now</text>

    <g class="never" opacity=".22">
      <text x="546" y="110" fill="#E9EFF6" font-size="11" font-weight="700">your policy</text>
      <rect x="498" y="118" width="96" height="26" rx="7" fill="#141C27" stroke="#2a3547"/>
      <rect x="498" y="176" width="96" height="26" rx="7" fill="#141C27" stroke="#2a3547"/>
      <line x1="546" y1="202" x2="546" y2="268" stroke="#2a3547" stroke-width="1.4" stroke-dasharray="4 5"/>
      <rect x="482" y="268" width="128" height="34" rx="9" fill="#141C27" stroke="#2a3547"/>
      <text x="546" y="289" fill="#8A97A6" font-size="10.5">wardryx decides</text>

      <text x="658" y="110" fill="#E9EFF6" font-size="11" font-weight="700">robots.txt</text>
      <rect x="610" y="118" width="96" height="26" rx="7" fill="#141C27" stroke="#2a3547"/>
      <rect x="610" y="176" width="96" height="26" rx="7" fill="#141C27" stroke="#2a3547"/>
      <text x="658" y="217" fill="#5A6675" font-size="9">the site's own,</text>
      <text x="658" y="229" fill="#5A6675" font-size="9">asked last</text>
    </g>

    <g class="say">
      <text x="434" y="250" fill="#FF8A8A" font-size="10" font-weight="700">deny_address</text>
      <text x="700" y="250" fill="#FF8A8A" font-size="9.5">the policy would have said allow, and was never asked</text>
    </g>

    <line x1="240" y1="260" x2="240" y2="290" stroke="#2a3547" stroke-width="1.4" stroke-dasharray="4 5"/>
    <rect x="146" y="290" width="228" height="52" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="260" y="311" fill="#E9EFF6" font-size="10.5" font-weight="700">its own journal</text>
    <text x="260" y="327" fill="#5A6675" font-size="9.5">the origin and a hash, never the URL</text>

    <rect x="646" y="290" width="300" height="52" rx="10" fill="#141C27" stroke="#2a3547"/>
    <text x="796" y="308" fill="#E9EFF6" font-size="10.5" font-weight="700">every answer says which guarantee held</text>
    <text x="796" y="323" fill="#5A6675" font-size="9">per_request or navigation_only,</text>
    <text x="796" y="335" fill="#5A6675" font-size="9">and a count nobody has is null</text>

    <rect x="812" y="134" width="134" height="52" rx="12" fill="#141C27" stroke="#2a3547"/>
    <text x="879" y="157" fill="#E9EFF6" font-size="11.5" font-weight="700">the open web</text>
    <text x="879" y="172" fill="#5A6675" font-size="9.5">nobody's promise</text>

    <g class="pkt" transform="translate(434,160)">
      <circle r="14" fill="#F0ABFC" opacity=".18"/>
      <rect x="-9" y="-9" width="18" height="18" rx="5" fill="#F0ABFC"/>
    </g>
  </g>
</svg>
