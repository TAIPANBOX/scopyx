# Build and publish the container image to GitHub Container Registry.
#
#   ghcr.io/<owner>/scopyx:v0.1.2     what a deployment pins
#   ghcr.io/<owner>/scopyx:sha-abc123  what a bisect points at
#
# **Immutable versions, no moving tag.** There is deliberately no `:latest` and
# no `:main`: this is the egress enforcement point for a governance stack, and
# "which build is running" has to have an answer that does not change under
# the operator. A tag that moves is a deployment whose contents change without
# a rollout anybody recorded (Yurii, 2026-08-02).
#
# Publishing runs on a tag, never on a merge: publishing on every push to main
# would mint artifacts nobody chose to release. `image-build` below also runs
# on a pull request that touches this file (see `pull_request`) and publishes
# nothing; see the `if:` on `image`.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # This workflow otherwise runs only on a `v*` tag, so its one job was proven
  # for the first time by the tag itself. TokenFuse's `v0.4.2` failed exactly
  # that way on 2026-09-02: the tag was the first thing that had ever run its
  # musl step, on a line the step had lost since the day it was written.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read
  packages: write

jobs:
  # Proves the Dockerfile itself still builds, both targets, on a pull request
  # that touches this workflow, before a tag ever reaches it. See `image`
  # below for the job that actually pushes.
  #
  # Both targets, the same way `image` below builds both: the stage order in
  # the Dockerfile is load-bearing (an unqualified build produces whichever
  # stage sits last), and only building both here would leave a reorder
  # visible on a tag and invisible on the pull request meant to catch it.
  image-build:
    name: build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the browser variant
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: browser
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: build + push
    # Never on a pull request: image-build above already proves both Dockerfile
    # targets build, and this job is the one that actually pushes to GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU is registered but not used for the compile: the Go build cross-
      # compiles from the runner's own architecture (see the Dockerfile's
      # BUILDPLATFORM/TARGETARCH). It is here for the base-image layers, which
      # buildx still resolves per platform.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scopyx
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is signed by digest and its provenance attested, keyless. A
      # stranger verifies with
      #   cosign verify ghcr.io/taipanbox/scopyx:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/scopyx/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/taipanbox/scopyx:<tag> -R TAIPANBOX/scopyx
      #
      # The browser variant below is pushed by a separate step and carries its
      # own digest under this same repository path (only the tag gets the
      # -chromium suffix), so it is signed and attested separately rather than
      # reusing this digest.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the image by digest, keyless
        run: cosign sign --yes "ghcr.io/taipanbox/scopyx@${{ steps.push.outputs.digest }}"
      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/taipanbox/scopyx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The browser variant, under its own tag and never under the plain one.
      #
      # It is 1.03 GB against 15.4 MB, both measured on 2026-08-10, and that
      # ratio is the reason it is a separate tag rather than the default: a
      # governance component that put a browser on every box whether or not the
      # operator wanted rendering would be answering a question nobody asked.
      - name: Image metadata, browser variant
        id: meta_browser
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scopyx
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-chromium
            type=sha,format=short,suffix=-chromium

      - name: Build and push the browser variant
        id: push_browser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: browser
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta_browser.outputs.tags }}
          labels: ${{ steps.meta_browser.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: sign the browser image by digest, keyless
        run: cosign sign --yes "ghcr.io/taipanbox/scopyx@${{ steps.push_browser.outputs.digest }}"
      - name: provenance attestation for the browser image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/taipanbox/scopyx
          subject-digest: ${{ steps.push_browser.outputs.digest }}
          push-to-registry: true

      - name: Say what was published
        run: |
          echo "published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo "${{ steps.meta_browser.outputs.tags }}" | sed 's/^/  /'
          echo
          echo "platforms: linux/amd64, linux/arm64"

  release:
    name: release page
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SBOM of this build, SPDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of this build, CycloneDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: provenance attestation for the SBOMs
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl
      # A Release for every tag (RELEASE-1.0-PLAN 4.3 item 1): --verify-tag aborts
      # when the tag is not on the remote; the notes are generated from the merged
      # pull requests until a plane's 1.0 notes replace them.
      - name: release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the Release, or upload into one that already exists: the tags
          # cut before this job existed got their Release objects by hand on
          # 2026-09-12, and a re-dispatch against one of them must add the
          # assets rather than fail on a page that is already there.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
