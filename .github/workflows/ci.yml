name: ci

# COST: NOTHING. This repository is PUBLIC, and GitHub Actions minutes on
# standard runners are free for public repositories. There is no matrix, no
# larger runner, no self-hosted runner and no paid service here, deliberately.
# Adding any of those is a spending decision and needs saying out loud first,
# which is the estate's standing rule after Actions once burned a free
# private-repo pool nobody knew was metered.

# Push on main and pull requests only. `on: push` alone fires a second,
# identical run for every commit that is also on an open PR, which is twice the
# runner time for one answer. Free on a public repository and still waste, and
# waste on a shared free tier is queue time somebody else pays in.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches `toolchain` in go.mod. These two disagreeing is not
          # cosmetic: setup-go pins GOTOOLCHAIN=local, so a mismatch stops
          # being a silent extra download and becomes a hard failure.
          go-version: "1.26.5"
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: go build
        run: go build ./...

      # A browser, so the rendering backend is exercised rather than skipped.
      #
      # Without this the chromium cases skip, and a skipped test and a passing
      # test look identical in a summary line. SCOPYX_REQUIRE_CHROMIUM below
      # turns that skip into a failure, so the day this step breaks, CI says so
      # instead of going quietly green over an untested backend.
      - name: a browser for the rendering backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo snap install chromium
          command -v chromium || command -v chromium-browser

      - name: go test -race
        env:
          # Fail rather than skip when there is no browser. See above.
          SCOPYX_REQUIRE_CHROMIUM: "1"
          # CI ONLY, and never the shipped default.
          #
          # Ubuntu runners restrict the unprivileged user namespaces Chrome's
          # sandbox needs, so the browser refuses to start. The product does
          # NOT set this: an operator gets an error naming both ways out, and
          # the better one is to run as a user whose namespaces work, which
          # keeps the sandbox. Here the isolation is the runner itself, which
          # is destroyed after the job.
          SCOPYX_CHROMIUM_NO_SANDBOX: "1"
        run: go test -race ./...

      # The architectural gates. They run here as well as locally because a
      # gate that only runs on one machine is a gate that does not run.
      - name: the tool accepts no caller headers
        run: ./scripts/no-caller-headers.sh

      - name: one way out
        run: ./scripts/one-way-out.sh

      - name: every number the README states
        run: ./scripts/readme-numbers.sh

      - name: no decision is delegated to a backend
        run: ./scripts/no-delegated-decisions.sh

      - name: nothing outlives a fetch
        run: ./scripts/no-warm-context.sh

      - name: nothing claims compliance
        run: ./scripts/no-compliance-claims.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that started writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  # The image is built on every PR and pushed nowhere.
  #
  # A Dockerfile that only ever runs on a release tag is a Dockerfile that
  # breaks on a release tag, which is the worst moment to find out. This one
  # builds the same file the release workflow builds and throws the result
  # away, so the deployment artifact is proven by the same run that proves the
  # code. Single platform on purpose: cross-building arm64 here would double
  # the time to answer a question amd64 already answers.
  #
  # COST: nothing. Standard runner, public repository, no registry write.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: the image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The browser variant too, and for its own reason rather than symmetry:
      # the browser stage sits ABOVE the distroless one in the Dockerfile, so
      # `docker build .` with no target builds the small image. That ordering is
      # load-bearing and invisible, and it was wrong once: appended at the end,
      # the variant quietly became what an unqualified build produced. Building
      # both here means the day somebody reorders them, CI notices.
      - name: the browser variant builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: browser
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
